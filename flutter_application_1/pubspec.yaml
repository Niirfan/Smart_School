name: smartschool
description: "Smart School - ระบบบริหารจัดการโรงเรียน"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  http: ^1.2.0
  google_sign_in: ^6.2.1
  mobile_scanner: ^5.2.3
  shared_preferences: ^2.5.5
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1a237e"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
